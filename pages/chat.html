<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookly | Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/buttons.css" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../styles/chat.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="../Cookly.html" class="logo">Cookly</a>
      <nav class="nav-links" id="navLinks">
        <a href="../Cookly.html#home">Home</a>
        <a href="../Cookly.html#recipes">Recipes</a>
        <a href="favourites.html">Favorites</a>
      </nav>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </header>

  <main class="chat-layout">

    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">
        <h3>Messages</h3>
      </div>
      <div id="convoList" class="convo-list">
        <p class="convo-empty">Loading...</p>
      </div>
    </aside>

    <section class="chat-main">

      <div class="chat-empty-state hidden" id="chatEmptyState">
        <div class="chat-empty-icon">💬</div>
        <h3>Your Messages</h3>
        <p>Message recipe authors to share tips, ask questions, or just say hello.</p>
      </div>

      <div class="chat-panel hidden" id="chatWindow">
        <div class="chat-header" id="chatHeader">
          <button class="chat-back-btn" id="chatBackBtn">← Back</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-wrap">
          <textarea id="chatInput" class="chat-input" placeholder="Type a message…" rows="1"></textarea>
          <button id="sendBtn" class="btn btn-primary chat-send-btn">Send</button>
        </div>
      </div>

    </section>
  </main>

  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../scripts/chat.js"></script>
</body>
</html>
