<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cookly | Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/auth.css"/>
</head>
<body>

<div class="auth-container">

  <!-- Decorative Shapes -->
  <div class="shape shape-blue"></div>
  <div class="shape shape-coral"></div>

  <!-- Card -->
  <div class="auth-card">

    <h1>Create Account ✨</h1>
    <p>Join Cookly and start discovering recipes</p>

    <form id="registerForm">

      <div class="input-group">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name"/>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email"/>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password"/>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password"/>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>

    </form>

    <div class="auth-divider"><span>or</span></div>
    <button type="button" id="googleSignInBtn" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Continue with Google
    </button>

    <p class="auth-switch">
      Already have an account?
      <a href="Login.html">Log in</a>
    </p>

    <p id="message" class="message"></p>

  </div>
</div>

<script type="module" src="../scripts/auth.js"></script>
</body>
</html>
