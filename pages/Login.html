<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cookly | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/auth.css"/>
</head>
<body>

<div class="auth-container">

  <!-- Decorative Shapes -->
  <div class="shape shape-blue"></div>
  <div class="shape shape-coral"></div>

  <!-- Card -->
  <div class="auth-card">

    <h1>Welcome Back 👋</h1>
    <p>Log in to continue cooking amazing recipes</p>

    <form id="loginForm">

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email"/>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password"/>
      </div>

      <button type="submit" class="btn-primary">Log In</button>

    </form>

    <p class="auth-switch">
      Don’t have an account?
      <a href="Register.html">Sign up</a>
    </p>

    <p id="message" class="message"></p>

  </div>
</div>

<script type="module" src="../scripts/auth.js"></script>
</body>
</html>
